name: Collect kosher & diet places
on:
  workflow_dispatch:
    inputs:
      cities: { description: 'slugs, comma separated (empty = all)', required: false, default: '' }
  schedule: [{ cron: '17 3 * * 1' }]
  push:
    paths: ['scripts/build_osm.py', '.github/workflows/osm.yml']
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/build_osm.py "${{ github.event.inputs.cities }}"
      - if: always()
        run: |
          git config user.name "waytip-app"
          git config user.email "orso@outlook.co.il"
          git add data/osm
          git diff --cached --quiet || git commit -m "Update kosher & diet places from OpenStreetMap"
          git pull --rebase -q
          git push

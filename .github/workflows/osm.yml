name: Collect kosher & diet places
on:
  workflow_dispatch:
  schedule: [{ cron: '17 3 * * 1' }]
  push:
    paths: ['scripts/build_osm.py', '.github/workflows/osm.yml']
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_osm.py
      - run: |
          git config user.name "waytip-app"
          git config user.email "orso@outlook.co.il"
          git add data/osm
          git diff --cached --quiet || git commit -m "Update kosher & diet places from OpenStreetMap"
          git pull --rebase -q
          git push
